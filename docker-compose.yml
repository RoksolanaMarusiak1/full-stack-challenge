services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 3s
      timeout: 3s
      retries: 10

  # One-shot job: applies SQL migrations, then exits. The app starts only after it succeeded.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "--filter", "@url-shortener/engine", "db:migrate"]
    environment:
      - DATABASE_URL=postgres://shortener:shortener@db:5432/shortener
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PUBLIC_URL=http://localhost:3000
      - DATABASE_URL=postgres://shortener:shortener@db:5432/shortener
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
